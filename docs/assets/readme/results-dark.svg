    <dc:title>Retain gender while forgetting identity</dc:title>
    <dc:date>2026-10-15T10:29:10.889756</dc:date>
    <dc:description>LFW, ViT-B/32 with separate identity and gender heads; all 30 clients unlearn identity after round 50 of 100, with full participation. Test accuracy in %; higher gender and lower identity are desired. Means of 3 runs; no dispersion reported. Source: https://arxiv.org/pdf/2508.07873v1#page=10</dc:description>
